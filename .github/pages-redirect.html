<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Agent Minibar has moved</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://github.com/Truman-fan/Agent-Minibar/" />
  <meta http-equiv="refresh" content="0; url=https://github.com/Truman-fan/Agent-Minibar/" />
  <script>
    // Keep the sub-path, query and hash so old deep links (e.g. assets/app-icon.png) still resolve.
    var path = location.pathname.replace(/^\/Agent-Minibar\/?/i, "");
    location.replace("https://github.com/Truman-fan/Agent-Minibar/" + path + location.search + location.hash);
  </script>
</head>
<body>
  <p>Agent Minibar is available at <a href="https://github.com/Truman-fan/Agent-Minibar/">github.com/Truman-fan/Agent-Minibar</a>.</p>
</body>
</html>
