[package]
name = "agent-minibar"
version = "1.6.0"
edition = "2024"
authors = ["Truman_show"]
description = "Windows and Linux floating quota companion for AI agents and providers"
license = "Apache-2.0"
repository = "https://github.com/Truman-fan/Agent-Minibar"
homepage = "https://github.com/Truman-fan/Agent-Minibar"
readme = "README.md"
keywords = ["agents", "windows", "linux", "tray", "usage"]
categories = ["command-line-utilities", "gui"]

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
directories = "6"
font8x8 = "0.3"
fontdue = "0.9"
# Open VSX/release artwork only accepts common web and icon formats. Avoid
# pulling professional/raw image codecs into the desktop executable.
image = { version = "0.25", default-features = false, features = ["gif", "ico", "jpeg", "png", "webp"] }
png = "0.18"
# Release summaries ("What's new") are fetched as Markdown.
pulldown-cmark = { version = "0.13", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["tls", "native-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
# GitHub release archives and VSIX packages use Stored/Deflate entries. The
# default feature set also links encryption and five unused compression stacks.
zip = { version = "2", default-features = false, features = ["deflate"] }
zeroize = "1"
zstd = { version = "0.13", default-features = false }
# windows-rs is pinned to one commit so windows-core, windows and
# windows-numerics always resolve to matching versions.
windows-core = { git = "https://github.com/microsoft/windows-rs", rev = "07f344c019b8fdae4d398d4c2591596044cb416a" }
gpui = { version = "0.2.2", default-features = false }
futures = "0.3"
raw-window-handle = "0.6"
resvg = { version = "0.45", default-features = false }
smallvec = "1"
unicode-segmentation = "1"
fluent-bundle = "0.16"
unic-langid = "0.9"

[target.'cfg(windows)'.dependencies]
windows-numerics = { git = "https://github.com/microsoft/windows-rs", rev = "07f344c019b8fdae4d398d4c2591596044cb416a" }
tray-icon = { version = "0.24", default-features = false }
windows = { git = "https://github.com/microsoft/windows-rs", rev = "07f344c019b8fdae4d398d4c2591596044cb416a", default-features = false, features = [
    "std",
    "Foundation",
    "Graphics_Effects",
    "System",
    "UI_Composition",
    "UI_Composition_Desktop",
    "UI_ViewManagement",
    "Win32_UI_Accessibility",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

# Linux desktop integration shares GPUI's zbus 5 stack (no tokio): the
# StatusNotifierItem tray, notifications, the XDG portal and, through oo7
# (already used by GPUI), the Secret Service.
[target.'cfg(not(windows))'.dependencies]
ashpd = { version = "0.12", default-features = false, features = ["async-std"] }
flate2 = "1"
# The workspace-wide entry disables GPUI's defaults (Windows needs none of
# them); Linux needs its Wayland and X11 backends, or GPUI runs headless.
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11", "keep-alive"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"
oo7 = { version = "0.5", default-features = false, features = ["async-std", "native_crypto"] }
tar = { version = "0.4", default-features = false }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
fluent-syntax = "0.12"

[build-dependencies]
winresource = "0.1"

[lints.clippy]
# GPUI builders thread many callbacks and snapshot fields through one call.
too_many_arguments = "allow"

[profile.release]
lto = "thin"
strip = true
panic = "abort"

# GPUI rebuilds and lays out the popup during animation. Keep application
# code debuggable while optimizing the renderer and its hot dependencies
# for the normal `cargo run` / `cargo watch -x run` development workflow.
[profile.dev.package]
gpui = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

# GPUI 0.2.2 with its Windows blend state fixed to composite alpha (see the
# `agent-minibar patch` note in vendor/gpui's directx_renderer.rs).
# Translucent windows otherwise draw anti-aliased edges as gray hairlines.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
